spring:
  application:
    name: merchant-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/merchant_assistant}
    username: ${DB_USERNAME:merchant}
    password: ${DB_PASSWORD:merchant}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
openai:
  api-key: ${OPENAI_API_KEY:}
  api-url: ${OPENAI_API_URL:https://api.openai.com/v1/responses}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
app:
  security:
    enabled: true
    session-minutes: ${SESSION_MINUTES:120}
